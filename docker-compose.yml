services:
  driverid-app:
    build: .
    env_file:
      - ./.env
    expose:
      - "5173"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./api-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - driverid-app
    restart: unless-stopped